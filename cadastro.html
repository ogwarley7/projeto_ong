<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Seja um Apoiador - ONG Esperança Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Formulário de cadastro para voluntários e apoiadores da ONG Esperança Digital.">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images.png" alt="Logo ONG Esperança Digital">
            <h1>Esperança Digital</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario-cadastro" class="container form-section">
            <h2>Cadastre-se e Faça a Diferença</h2>
            <p class="subtitle">Seus dados nos ajudam a te conectar com as melhores oportunidades.</p>

            <form action="#" method="post" class="user-form"> <fieldset>
                    <legend>Informações Pessoais</legend>
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome_completo" required placeholder="Seu nome completo">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="exemplo@dominio.com">
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" data-mask="cpf"
                               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(99) 99999-9999" data-mask="telefone"
                               pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Formato: (99) 99999-9999 ou (99) 9999-9999">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>
                    
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" required placeholder="00000-000" data-mask="cep"
                               pattern="\d{5}-\d{3}" title="Formato: 00000-000">
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" required placeholder="Rua, Avenida ou Travessa">
                    </div>
                    
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input list="estados" id="estado" name="estado" required placeholder="Ex: SP" maxlength="2">
                        <datalist id="estados">
                            <option value="AC"><option value="AL"><option value="AP"><option value="AM"><option value="BA">
                            <option value="CE"><option value="DF"><option value="ES"><option value="GO"><option value="MA">
                            <option value="MT"><option value="MS"><option value="MG"><option value="PA"><option value="PB">
                            <option value="PR"><option value="PE"><option value="PI"><option value="RJ"><option value="RN">
                            <option value="RS"><option value="RO"><option value="RR"><option value="SC"><option value="SP">
                            <option value="SE"><option value="TO">
                        </datalist>
                    </div>
                </fieldset>

                <button type="submit" class="cta-button primary-btn">Concluir Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ONG Esperança Digital. Todos os direitos reservados.</p>
        <div class="social-links">
            <a href="#" target="_blank" aria-label="Link para o Facebook">Facebook</a>
            <a href="#" target="_blank" aria-label="Link para o Instagram">Instagram</a>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
